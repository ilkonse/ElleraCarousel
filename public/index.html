<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ellera Polcanto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Karla:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/carousel.css" />
</head>
<body>
  <div id="carousel-root">
    <div class="stage-wrap">
      <div class="photo-stage">
        <img class="photo photo-a" alt="" />
        <img class="photo photo-b" alt="" />
        <div class="stage-vignette"></div>
        <div class="stage-inner-shadow"></div>
      </div>

      <div class="ivy-overlay">
        <img class="ivy-corner ivy-tl" src="/img/ivy-corner.svg" alt="" />
        <img class="ivy-corner ivy-tr" src="/img/ivy-corner.svg" alt="" />
        <img class="ivy-corner ivy-bl" src="/img/ivy-corner.svg" alt="" />
        <img class="ivy-corner ivy-br" src="/img/ivy-corner.svg" alt="" />
        <div class="ivy-edge ivy-edge-top"></div>
        <div class="ivy-edge ivy-edge-bottom"></div>
        <div class="ivy-edge ivy-edge-left"></div>
        <div class="ivy-edge ivy-edge-right"></div>
      </div>

      <p class="empty-state" hidden>Nessuna foto è stata ancora caricata.</p>
      <a class="admin-link" href="/admin" title="Amministrazione">admin</a>
    </div>
  </div>

  <script src="/js/carousel.js"></script>
</body>
</html>
